name: Badger Builder
slug: badger-builder
type: plugin
version: 1.0.0
description: Flexible page sections builder for Admin2 with theme-agnostic front-end rendering
icon: layer-group
author:
  name: Intention
  email: admin@fcswebsites.co.uk
homepage: https://gitea.com/byintention/badgerbuilder
keywords: grav, plugin, page-builder, sections, admin2
license: MIT
gpm: false

dependencies:
  - { name: grav, version: '>=2.0.0-rc.1' }
  - { name: api, version: '>=1.0.0-rc.1' }

compatibility:
  grav:
    - '2.0'

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    enabled_panels:
      type: checkboxes
      label: PLUGIN_BADGER_BUILDER.ENABLED_PANELS
      default: [hero, features, text, full, filler, boxes, faq, opener, closer]
      options:
        hero: Hero
        features: Features grid
        text: Text + image
        full: Full width
        filler: Filler
        boxes: Boxes
        faq: FAQ
        testimonials: Testimonials
        opener: Opener
        closer: Closer

    default_panel:
      type: select
      label: PLUGIN_BADGER_BUILDER.DEFAULT_PANEL
      default: text
      options:
        hero: Hero
        features: Features grid
        text: Text + image
        full: Full width
        filler: Filler
        boxes: Boxes
        faq: FAQ
        testimonials: Testimonials
        opener: Opener
        closer: Closer

    show_panel_labels:
      type: toggle
      label: PLUGIN_BADGER_BUILDER.SHOW_PANEL_LABELS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

    built_in_css:
      type: toggle
      label: PLUGIN_BADGER_BUILDER.BUILT_IN_CSS
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

    local_panels_section:
      type: section
      title: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_SECTION
      underline: true

    local_panels.enabled:
      type: toggle
      label: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_ENABLED
      help: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_ENABLED_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

    local_panels.theme_path:
      type: text
      label: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_THEME_PATH
      help: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_THEME_PATH_HELP
      default: badger-builder/panels

    local_panels.data_path:
      type: text
      label: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_DATA_PATH
      help: PLUGIN_BADGER_BUILDER.LOCAL_PANELS_DATA_PATH_HELP
      default: badger-builder/panels

    updates_section:
      type: section
      title: PLUGIN_BADGER_BUILDER.UPDATES_SECTION
      underline: true

    updates.enabled:
      type: toggle
      label: PLUGIN_BADGER_BUILDER.UPDATES_ENABLED
      help: PLUGIN_BADGER_BUILDER.UPDATES_ENABLED_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

    updates.base_url:
      type: text
      label: PLUGIN_BADGER_BUILDER.UPDATES_BASE_URL
      help: PLUGIN_BADGER_BUILDER.UPDATES_BASE_URL_HELP
      default: https://gitea.com

    updates.owner:
      type: text
      label: PLUGIN_BADGER_BUILDER.UPDATES_OWNER
      default: byintention

    updates.repo:
      type: text
      label: PLUGIN_BADGER_BUILDER.UPDATES_REPO
      default: badgerbuilder

    updates.token:
      type: password
      label: PLUGIN_BADGER_BUILDER.UPDATES_TOKEN
      help: PLUGIN_BADGER_BUILDER.UPDATES_TOKEN_HELP

    updates.asset_prefix:
      type: text
      label: PLUGIN_BADGER_BUILDER.UPDATES_ASSET_PREFIX
      help: PLUGIN_BADGER_BUILDER.UPDATES_ASSET_PREFIX_HELP
      default: badger-builder-

    updates.prerelease:
      type: toggle
      label: PLUGIN_BADGER_BUILDER.UPDATES_PRERELEASE
      help: PLUGIN_BADGER_BUILDER.UPDATES_PRERELEASE_HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

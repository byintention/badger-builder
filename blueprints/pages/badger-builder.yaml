title: Badger Builder
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.title:
              ordering@: 1
            header.sections:
              unset@: true
            content:
              unset@: true
            header.media_order:
              unset@: true

        sections_tab:
          type: tab
          title: PLUGIN_BADGER_BUILDER.SECTIONS
          fields:
            header.sections:
              type: sections
              label: PLUGIN_BADGER_BUILDER.SECTIONS
              help: PLUGIN_BADGER_BUILDER.SECTIONS_HELP
              style: vertical
              xss_check: false
              panel_endpoint: /badger-builder/panels
              config_endpoint: /badger-builder/config

        options:
          fields:
            site_meta:
              type: section
              title: PLUGIN_BADGER_BUILDER.SITE_META
              underline: true
              fields:
                header.job_code:
                  type: text
                  label: PLUGIN_BADGER_BUILDER.JOB_CODE
                  help: PLUGIN_BADGER_BUILDER.JOB_CODE_HELP

                header.brand:
                  type: select
                  label: PLUGIN_BADGER_BUILDER.BRAND
                  help: PLUGIN_BADGER_BUILDER.BRAND_HELP
                  default: accrete
                  options:
                    accrete: PLUGIN_BADGER_BUILDER.BRAND_ACCRETE
                    binosto: PLUGIN_BADGER_BUILDER.BRAND_BINOSTO
                    fultium: PLUGIN_BADGER_BUILDER.BRAND_FULTIUM
                    movymia: PLUGIN_BADGER_BUILDER.BRAND_MOVYMIA
